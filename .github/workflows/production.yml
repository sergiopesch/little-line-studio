name: Production verification

on:
  workflow_run:
    workflows: [App regression checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verification
  cancel-in-progress: true

jobs:
  production:
    if: >-
      github.repository == 'sergiopesch/little-line-studio' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          npx playwright install --with-deps chromium firefox webkit
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=browser_checks
          pactl set-default-sink browser_checks
      - name: Wait for the merged release and verify the public demo
        run: npm run verify:production -- --url https://little-line-studio.vercel.app --commit "$RELEASE_COMMIT" --wait 600
      - name: Retain production verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-verification-${{ env.RELEASE_COMMIT }}
          path: output/production-verification/
          retention-days: 14
          if-no-files-found: warn
