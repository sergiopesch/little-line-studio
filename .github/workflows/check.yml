name: App regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install audio fixture and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils
          python3 -c "import subprocess; v = subprocess.check_output(['ffmpeg', '-version'], text=True).splitlines()[0]; print(v); assert v.startswith('ffmpeg version 8.'), 'Offline media fixtures are qualified with FFmpeg 8.x'"
          npx playwright install --with-deps chromium firefox webkit
      - name: Build and verify content, media and controller
        run: npm run check
      - name: Start virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=browser_checks
          pactl set-default-sink browser_checks
          pactl list short sinks
      - name: Verify browser flows
        run: npm run test:browser
      - name: Prepare every localized lesson for review
        run: npm run review:localization
      - name: Keep localization review packets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: localization-review
          path: output/localization-review/catalogue-*/
          retention-days: 14
          if-no-files-found: error
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-evidence
          path: output/playwright/
          retention-days: 7
          if-no-files-found: ignore
